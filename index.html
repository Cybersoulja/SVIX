<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Svix Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Svix webhook management dashboard">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0f172a">
</head>

<body>

  <!-- Site header -->
  <header class="site-header">
    <div class="header-inner">
      <span class="site-title">Svix Dashboard</span>
      <div id="header-status" class="header-status"></div>
    </div>
  </header>

  <!-- Auth screen -->
  <section id="auth-panel" class="auth-screen" hidden>
    <div class="auth-card panel">
      <h2 class="auth-heading">Connect to Svix</h2>
      <form id="connect-form">
        <div class="form-row">
          <label for="api-key">API Key</label>
          <input id="api-key" type="password" placeholder="sk_…" autocomplete="off" required />
        </div>
        <div class="form-row">
          <label for="region">Region</label>
          <select id="region">
            <option value="eu">EU — api.eu.svix.com</option>
            <option value="us">US — api.svix.com</option>
            <option value="in">IN — api.in.svix.com</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Connect</button>
      </form>
    </div>
  </section>

  <!-- Apps list view -->
  <section id="view-apps" class="container view" hidden>
    <div class="view-header">
      <h2 class="view-title">Applications</h2>
      <button id="create-app-btn" class="btn btn-primary btn-sm">+ New Application</button>
    </div>
    <div id="apps-grid" class="apps-grid"></div>
  </section>

  <!-- App detail view -->
  <section id="view-app-detail" class="container view" hidden>
    <div class="view-header">
      <button id="back-btn" class="btn btn-ghost btn-sm">← Applications</button>
      <h2 class="view-title" id="detail-app-name"></h2>
    </div>

    <div class="tabs">
      <button class="tab-btn tab-btn--active" data-tab="endpoints">Endpoints</button>
      <button class="tab-btn" data-tab="messages">Messages</button>
    </div>

    <!-- Endpoints tab -->
    <div id="tab-endpoints" class="tab-panel">
      <div class="tab-toolbar">
        <button id="add-endpoint-btn" class="btn btn-primary btn-sm">+ Add Endpoint</button>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>URL</th>
            <th>Description</th>
            <th>Status</th>
            <th>Created</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="endpoints-tbody"></tbody>
      </table>
    </div>

    <!-- Messages tab -->
    <div id="tab-messages" class="tab-panel tab-panel--hidden">
      <table class="data-table">
        <thead>
          <tr>
            <th>Event Type</th>
            <th>Message ID</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="messages-tbody"></tbody>
      </table>
      <div class="pagination-bar">
        <button id="msg-prev-btn" class="btn btn-ghost btn-sm" disabled>← Previous</button>
        <button id="msg-next-btn" class="btn btn-ghost btn-sm" disabled>Next →</button>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button id="modal-close-btn" class="btn-icon" aria-label="Close">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
        <button id="modal-submit-btn" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Analyzer drawer -->
  <aside id="analyzer-panel" class="analyzer-panel" hidden>
    <div class="analyzer-header">
      <div class="analyzer-title-row">
        <span class="analyzer-badge">Claude AI</span>
        <span class="analyzer-title">Endpoint Analysis</span>
      </div>
      <button id="analyzer-close-btn" class="btn-icon" aria-label="Close analysis">×</button>
    </div>
    <div id="analyzer-endpoint-info" class="analyzer-endpoint-info"></div>
    <div id="analyzer-content" class="analyzer-content"></div>
  </aside>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/app.js" type="module"></script>
</body>

</html>
