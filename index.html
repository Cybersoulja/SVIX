<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Svix App Creator</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="A tool to create Svix Apps">

  <meta property="og:title" content="Svix App Creator">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <!-- Add your site or application content here -->
  <div class="container">
    <h1>Svix App Creator</h1>
    <p>Use this tool to create a new App in your Svix account.</p>

    <form id="svix-form">
      <div class="form-group">
        <label for="api-token">Svix API Token (Bearer)</label>
        <input type="password" id="api-token" name="api-token" required placeholder="Paste your API token here">
      </div>

      <div class="form-group">
        <label for="app-name">App Name</label>
        <input type="text" id="app-name" name="app-name" required placeholder="e.g. Oneseco-IO">
      </div>

      <button type="submit">Create App</button>
    </form>

    <div id="result-container" class="hidden">
      <h2>Result</h2>
      <pre id="result-content"></pre>
    </div>
  </div>

  <script src="js/app.js"></script>

</body>

</html>
